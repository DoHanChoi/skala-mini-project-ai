# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
early_access: false
tone_instructions: >-
  한국어로 구체적인 재현 조건, 영향, 수정 방향을 간결하게 설명하세요.
  실제 버그와 보안·회귀 위험을 우선하고 취향에 따른 스타일 지적은 줄이세요.

reviews:
  profile: chill
  request_changes_workflow: true
  allow_author_approval: false
  high_level_summary: true
  review_status: true
  review_info: true
  review_progress: true
  fail_commit_status: true
  poem: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
  path_filters:
    - "!.venv/**"
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.db"
    - "!**/*.log"
  path_instructions:
    - path: "agent/**/*.py"
      instructions: >-
        연결된 현재 이슈와 doc/PLAN_A.md의 해당 단계 완료 기준을 기준으로 리뷰하세요.
        아직 착수하지 않은 후속 단계 기능의 부재를 현재 PR의 결함으로 요구하지 마세요.
        시스템·측정 항목·수치·단위·근거 ID의 혼동, 원본 근거 변경, 실패의 성공 처리,
        재작성 상한, fake/ollama/openai 계약 차이와 일반 대화·v1 회귀를 확인하세요.
    - path: "server.py"
      instructions: >-
        REST와 SSE 최종 결과의 동등성, 종료 이벤트, 세션 격리를 확인하세요.
        A안 통합 이후 장애 경로에서 검증 전 초안과 원시 프롬프트가 외부 응답이나
        저장 대화에 노출되지 않는지 확인하세요. 기존 API 호환성 변경을 지적하세요.
    - path: "web_chat.html"
      instructions: >-
        사실·가설·조치의 구분, 검증 범위 표시, 실패 상태와 스트리밍 종료 처리를 확인하세요.
        외부 데이터와 매뉴얼은 HTML로 실행하지 않아야 합니다.
        검증되지 않은 초안이나 가설이 검증된 사실처럼 표시되는지 확인하세요.
    - path: "tests/**"
      instructions: >-
        고정 fixture와 임시 DB를 사용하고 외부 API 호출 없이 실행되는지 확인하세요.
        잘못된 값·시스템·단위·근거, 정상 입력 오탐, 재작성 종료와 회귀를 검증하는지 보세요.
        구현을 그대로 복사한 테스트보다 독립적인 기대 결과와 실제 실패 조건을 중시하세요.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      - doc/PLAN_A.md

chat:
  auto_reply: true
