<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>운영 에이전트 채팅 (Vue)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: #1e1e2e; color: #e2e2f0;
    overflow: hidden;   /* #log만 스크롤되게, 바디 자체는 늘어나지 않게 고정 */
  }
  #app {
    flex: 1; min-height: 0;   /* Vue 마운트 루트가 header/#log/form을 감싸므로,
                                 body의 flex 흐름이 여기까지 이어지게 한다 */
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: #262638; border-bottom: 1px solid #3a3a52;
    font-weight: 600; font-size: 15px;
  }
  header span { color: #8b8bd8; font-weight: 400; font-size: 13px; margin-left: 8px; }
  #log {
    flex: 1; min-height: 0;   /* flex 자식 기본 최소높이(콘텐츠 크기)를 풀어줘야
                                 내용이 길어져도 바디가 안 늘어나고 여기서만 스크롤됨 */
    overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  #log::-webkit-scrollbar { width: 9px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: #3a3a52; border-radius: 6px; }
  #log::-webkit-scrollbar-thumb:hover { background: #4a4a68; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 70%; padding: 10px 14px; border-radius: 14px; line-height: 1.5;
    font-size: 14px; white-space: pre-wrap;
  }
  .row.user .bubble { background: #5b5bd6; color: white; border-bottom-right-radius: 4px; }
  .row.agent .bubble { background: #2e2e42; border-bottom-left-radius: 4px; }
  .steps {
    max-width: 70%; font-size: 12px; color: #9a9ac0; padding: 6px 14px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .steps .step::before { content: "⏳ "; }
  .steps .step.done::before { content: "✓ "; color: #7ee787; }
  .answer { width: min(100%, 940px); min-width: 0; padding: 16px; background: #2e2e42;
    border: 1px solid #454560; border-radius: 14px; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
  .answer-status { margin: 0 0 8px; font-size: 14px; font-weight: 650; color: #c4c4e5; }
  .answer.passed .answer-status { color: #9ee0ba; }
  .answer.failed .answer-status { color: #ffb7a9; }
  .scope, .section-note, .source-state { color: #b7b7d0; font-size: 12px; }
  .scope { margin: 0 0 16px; }
  .answer-section { border-top: 1px solid #484861; padding-top: 12px; margin-top: 12px; }
  .answer-section h3 { font-size: 14px; margin: 0 0 4px; }
  .section-note { margin: 0 0 8px; }
  .answer ul { padding-left: 20px; margin: 8px 0; }
  .answer li { margin: 6px 0; }
  .reply { white-space: pre-wrap; margin: 0; }
  .source-ref { padding: 2px 7px; margin: 2px 0 2px 6px; border: 1px solid #7777b5;
    background: transparent; color: #d2d2ff; font-size: 12px; border-radius: 5px; }
  .source-ref:disabled { color: #c0b5b5; background: transparent; border-color: #69606a; }
  .source-list { margin-top: 16px; }
  .source-list h3 { font-size: 14px; margin-bottom: 8px; }
  .source { background: #222233; border: 1px solid #4c4c66; border-radius: 8px; margin: 8px 0; }
  summary { cursor: pointer; padding: 9px 12px; }
  summary:focus-visible, button:focus-visible { outline: 2px solid #b4b4ff; outline-offset: 2px; }
  .source-body { border-top: 1px solid #454560; padding: 10px 12px; }
  .source dl { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 5px 10px; margin: 0; font-size: 12px; }
  .source dt { color: #b7b7d0; }
  .source dd { margin: 0; white-space: pre-wrap; }
  .source pre { max-height: 300px; overflow: auto; padding: 10px; background: #191926;
    white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.6 ui-monospace, monospace; }
  .source-state { display: block; }
  .validation-errors { font-size: 12px; margin: 8px 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  @media (max-width: 600px) {
    header { padding: 12px; }
    header span { display: block; margin: 4px 0 0; overflow-wrap: anywhere; }
    #log { padding: 12px; }
    .bubble, .steps { max-width: 100%; }
    .answer { padding: 12px; }
    .source dl { grid-template-columns: 72px minmax(0, 1fr); }
    form { padding: 12px; }
  }
  form { display: flex; gap: 8px; padding: 14px 20px; background: #262638; border-top: 1px solid #3a3a52; }
  input {
    flex: 1; min-width: 0; padding: 11px 14px; border-radius: 10px; border: 1px solid #3a3a52;
    background: #1e1e2e; color: #e2e2f0; font-size: 14px;
  }
  input:focus { outline: 1px solid #5b5bd6; }
  button {
    padding: 11px 20px; border-radius: 10px; border: none; background: #5b5bd6;
    color: white; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #3a3a52; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>운영 인시던트 대응 에이전트 <span>{{ backendLabel }}</span></header>
  <div id="log" ref="logEl">
    <template v-for="item in log" :key="item.id">
      <div v-if="item.kind === 'user'" class="row user">
        <div class="bubble">{{ item.text }}</div>
      </div>

      <div v-else-if="item.kind === 'steps'" class="steps">
        <div v-for="(step, i) in item.steps" :key="i" class="step" :class="{done: item.complete}">{{ step }}</div>
      </div>

      <div v-else-if="item.kind === 'agent'" class="row agent">
        <article v-if="item.view" class="answer" :class="item.view.status" :aria-label="item.view.label">
          <h2 class="answer-status">{{ item.view.label }}<span v-if="item.view.attempt"> · 작성 {{ item.view.attempt }}회</span></h2>
          <p v-if="item.view.notice" class="scope">{{ item.view.notice }}</p>

          <template v-if="item.view.diagnosis">
            <section class="answer-section" aria-label="관측 사실">
              <h3>관측 사실</h3>
              <p class="section-note">값·시스템·단위·출처 연결 확인</p>
              <ul>
                <li v-for="(observation, i) in item.view.diagnosis.observations" :key="i">
                  <strong>{{ observation.system_name }}</strong> · {{ metricLabel(observation.metric) }}:
                  {{ displayValue(observation.value) }}{{ observation.unit || '' }}
                  <button class="source-ref" type="button" :disabled="sourceIndex(item, observation.evidence_id) < 0"
                    :aria-controls="sourceDomId(item, observation.evidence_id)"
                    @click="showEvidence(item, observation.evidence_id)">{{ sourceLabel(item, observation.evidence_id) }}</button>
                </li>
              </ul>
            </section>
            <section v-for="section in claimSections" :key="section.key" class="answer-section" :aria-label="section.title">
              <h3>{{ section.title }}</h3>
              <p class="section-note">{{ section.notice }}</p>
              <ul v-if="item.view.diagnosis[section.key].length">
                <li v-for="(statement, i) in item.view.diagnosis[section.key]" :key="i">
                  {{ statement.text }}
                  <button v-for="id in statement.evidence_ids" :key="id" class="source-ref" type="button"
                    :disabled="sourceIndex(item, id) < 0" :aria-controls="sourceDomId(item, id)"
                    @click="showEvidence(item, id)">{{ sourceLabel(item, id) }}</button>
                </li>
              </ul>
              <p v-else class="section-note">제안 없음</p>
            </section>
          </template>
          <p v-else class="reply">{{ item.text }}</p>

          <details v-if="item.view.errors.length" class="validation-errors">
            <summary>검증 오류 {{ item.view.errors.length }}개 보기</summary>
            <ul><li v-for="(error, i) in item.view.errors" :key="i">{{ error.message }} ({{ error.code }} · {{ error.path }})</li></ul>
          </details>

          <section v-if="item.view.evidence.length" class="source-list" aria-label="수집 근거">
            <h3>수집 근거 {{ item.view.evidence.length }}개</h3>
            <p class="section-note">원본 스냅샷입니다. 인용 가능 표시는 문장 의미나 출처의 진위를 보증하지 않습니다.</p>
            <details v-for="(source, i) in item.view.evidence" :key="i" class="source" :id="`evidence-${item.id}-${i}`">
              <summary>근거 {{ i + 1 }} · {{ source.source === 'monitoring' ? '모니터링' : '매뉴얼' }} · {{ source.system_name || source.title || source.target }}
                <span class="source-state">{{ source.available ? '인용 가능' : '인용 불가' }}</span>
              </summary>
              <div class="source-body">
                <dl>
                  <dt>근거 ID</dt><dd>{{ source.id }}</dd>
                  <dt>대상</dt><dd>{{ source.target }}</dd>
                  <dt>MCP 서버</dt><dd>{{ source.server }}</dd>
                  <dt>출처</dt><dd>{{ source.locator }}</dd>
                  <dt>조회 시각</dt><dd>{{ source.retrieved_at || '제공되지 않음' }}</dd>
                  <dt>관측 시각</dt><dd>{{ source.observed_at || '제공되지 않음' }}</dd>
                  <template v-if="source.title"><dt>문서 제목</dt><dd>{{ source.title }}</dd></template>
                  <template v-if="source.content_sha256"><dt>본문 해시</dt><dd>{{ source.content_sha256 }}</dd></template>
                  <dt>인용 항목</dt><dd>{{ source.eligible_metrics.map(metricLabel).join(', ') || (source.source === 'runbook' ? '본문 참조' : '없음') }}</dd>
                  <dt>활용 제한</dt><dd>{{ source.issues.map(issueLabel).join(', ') || '수집 시 탐지된 제한 없음' }}</dd>
                </dl>
                <h4>원본 {{ source.source === 'runbook' ? '본문' : '값' }}</h4>
                <pre>{{ rawText(source.raw) }}</pre>
              </div>
            </details>
          </section>
        </article>
        <div v-else class="bubble">{{ item.text }}</div>
      </div>
    </template>
  </div>
  <form @submit.prevent="onSubmit">
    <label class="sr-only" for="message">메시지</label>
    <input id="message"
      v-model="input"
      autocomplete="off"
      placeholder="예: auth-service 로그인 응답이 느려졌어요. 원인 확인해주세요"
    />
    <button type="submit" :disabled="sending">보내기</button>
  </form>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, reactive, nextTick } = Vue;

const claimSections = [
  {key: 'hypotheses', title: '원인 가설', notice: '추정 · 문장 의미와 인과관계는 검증하지 않았습니다.'},
  {key: 'actions', title: '권장 조치', notice: '미실행 제안 · 문장 의미와 조치 효과는 검증하지 않았습니다.'},
];

/** 표시 이름만 바꾸며 원본 관측값과 단위는 변환하지 않는다. */
function metricLabel(metric) {
  return {cpu_percent: 'CPU 사용률', memory_percent: '메모리 사용률', status: '상태', alerts: '알림'}[metric] || metric;
}

/** unknown·누락·없는 매뉴얼을 사용자가 확인할 수 있는 문구로 표시한다. */
function issueLabel(issue) {
  const labels = {unknown_system: '미인식 시스템', system_mismatch: '조회 대상과 시스템 불일치',
    invalid_status: '비정상 상태 값', invalid_monitoring_body: '모니터링 본문 형식 오류',
    missing_cpu_percent: 'CPU 값 누락', invalid_cpu_percent: 'CPU 값 오류',
    missing_memory_percent: '메모리 값 누락', invalid_memory_percent: '메모리 값 오류',
    missing_alerts: '알림 누락', invalid_alerts: '알림 형식 오류',
    missing_observed_at: '관측 시각 누락', invalid_observed_at: '관측 시각 오류',
    runbook_not_found: '매뉴얼 없음', empty_runbook: '빈 매뉴얼',
    invalid_runbook_body: '매뉴얼 본문 형식 오류', missing_title: '문서 제목 누락'};
  return labels[issue] || issue;
}

/** 구조화된 원본 값을 텍스트로만 표시한다. */
function displayValue(value) {
  return typeof value === 'string' ? value : JSON.stringify(value);
}

/** 원문 HTML·Markdown·URI를 해석하지 않고 읽을 수 있는 원본 텍스트를 만든다. */
function rawText(value) {
  return typeof value === 'string' ? value : (JSON.stringify(value, null, 2) ?? '제공되지 않음');
}

/** 알려진 판정과 완전한 진단 구역이 있을 때만 성공 표시를 제공한다. */
function answerView(answer) {
  const v = answer.validation;
  const d = answer.diagnosis;
  const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  const diagnosisShape = object(d) && Array.isArray(d.observations) && d.observations.length > 0 &&
    d.observations.every(o => object(o) && typeof o.system_name === 'string' && typeof o.evidence_id === 'string' &&
      ['cpu_percent', 'memory_percent', 'status', 'alerts'].includes(o.metric) &&
      (typeof o.value === 'string' || (typeof o.value === 'number' && Number.isFinite(o.value))) &&
      (o.unit === null || typeof o.unit === 'string')) &&
    ['hypotheses', 'actions'].every(key => Array.isArray(d[key]) &&
      d[key].every(s => object(s) && typeof s.text === 'string' && Array.isArray(s.evidence_ids) &&
        s.evidence_ids.every(id => typeof id === 'string')));
  let status = 'unknown';
  let label = '검증 상태 확인 불가';
  let notice = '검증 정보가 없거나 지원하지 않는 응답입니다. 아래 답변을 검증 성공으로 해석하지 마세요.';
  let diagnosis = null;
  if (v?.status === 'passed' && v.passed === true && v.scope === 'observed_values_and_source_links' && diagnosisShape) {
    status = 'passed';
    label = '관측값·출처 연결 확인';
    notice = '검사 범위: 시스템명·지표·값·단위·출처 연결. 가설·조치의 의미는 검증하지 않았습니다.';
    diagnosis = d;
  } else if (v?.status === 'failed' && v.passed === false) {
    status = 'failed';
    label = '진단 검증 실패';
    notice = '확인된 원본 관측만 표시합니다. 실패한 초안의 가설·조치는 표시하지 않습니다.';
  } else if (v?.status === 'not_applicable' && v.passed === null) {
    status = 'not-applicable';
    label = '검증 비대상' + (v.reason === 'general_chat' ? ' · 일반 대화' : v.reason === 'legacy_v1' ? ' · v1' : '');
    notice = '이 응답에는 A안의 관측값·출처 연결 검사를 적용하지 않았습니다.';
  }
  return {status, label, notice, diagnosis,
    attempt: (status === 'passed' || status === 'failed') && Number.isInteger(v?.attempt) && v.attempt >= 1 && v.attempt <= 3 ? v.attempt : null,
    evidence: Array.isArray(answer.evidence) ? answer.evidence.filter(object).map(source => ({...source,
      available: source.available === true,
      eligible_metrics: Array.isArray(source.eligible_metrics) ? source.eligible_metrics : [],
      issues: Array.isArray(source.issues) ? source.issues : []})) : [],
    errors: status === 'failed' && Array.isArray(v.errors) ? v.errors.filter(object) : []};
}

/** 근거는 현재 답변 안에서만 찾으며 이름이나 다른 요청의 목록으로 폴백하지 않는다. */
function sourceIndex(item, id) {
  return item.view.evidence.findIndex(source => source.id === id);
}

/** 외부 근거 ID를 DOM 선택자로 사용하지 않고 답변·목록 위치를 조합한다. */
function sourceDomId(item, id) {
  const index = sourceIndex(item, id);
  return index < 0 ? null : `evidence-${item.id}-${index}`;
}

/** 짧은 참조 번호와 없는 출처를 구분한다. */
function sourceLabel(item, id) {
  const index = sourceIndex(item, id);
  return index < 0 ? '출처 없음' : `근거 ${index + 1}`;
}

const STEP_LABELS = {
  PlanCreated: e => `계획 수립: 할 일 ${e.task_count}가지${e.targets?.length ? ` (시스템: ${e.targets.join(', ')})` : ''}`,
  GateApplied: e => e.removed_analysis_tasks ? `불필요한 작업 ${e.removed_analysis_tasks}건 제거` : null,
  TaskCompleted: e => (e.source === 'monitoring'
      ? `모니터링 지표 확인${e.target ? ` (시스템: ${e.target})` : ''}`
      : `대응 매뉴얼(runbook) 조회${e.target ? ` (장애유형: ${e.target})` : ''}`) + (e.retries ? ' (재시도 성공)' : ''),
  ReplanCheck: e => e.is_sufficient ? null : `정보 부족 → 장애유형 "${e.target}"로 추가 조사`,
  DraftWritten: e => `답변 초안 작성 (시도 ${e.attempt})`,
  Validation: e => e.passed ? '관측값·출처 연결 확인' :
    (e.will_retry ? '검증 반려 → 다시 작성' : '검증 실패 → 확인된 원본 관측만 표시'),
  Finalize: () => '최종 답변 완성',
};

createApp({
  setup() {
    const backendLabel = ref('all_total_vue');
    const log = ref([]);
    const input = ref('');
    const sending = ref(false);
    const logEl = ref(null);
    const thread = 't-web-' + Math.random().toString(36).slice(2, 8);
    let nextId = 0;

    fetch('/health').then(r => r.json()).then(h => {
      backendLabel.value = `${h.llm_backend === 'fake' ? 'fake 테스트 모델' : h.llm_backend} (${h.fast_llm}/${h.quality_llm})`;
    }).catch(() => {});

    async function scrollToBottom() {
      await nextTick();
      if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight;
    }

    /** 해당 답변의 근거만 펼치고 summary로 키보드 초점을 옮긴다. */
    async function showEvidence(item, id) {
      const domId = sourceDomId(item, id);
      if (!domId) return;
      await nextTick();
      const details = document.getElementById(domId);
      if (!details) return;
      details.open = true;
      details.querySelector('summary')?.focus({preventScroll: true});
      details.scrollIntoView({block: 'nearest', behavior: 'smooth'});
    }

    function onSubmit() {
      if (sending.value) return;
      const text = input.value.trim();
      if (!text) return;

      log.value.push({ id: nextId++, kind: 'user', text });
      input.value = '';
      sending.value = true;
      scrollToBottom();

      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [], complete: false });
      log.value.push(stepsItem);
      scrollToBottom();

      const url = `/chat/stream?message=${encodeURIComponent(text)}&thread_id=${encodeURIComponent(thread)}`;
      const es = new EventSource(url);
      let streamItem = null;
      let streamAttempt = null;   // write_node 재작성(attempt 증가) 시 새 말풍선으로 끊는다
      let route = null;

      es.onmessage = (event) => {
        if (event.data === '[DONE]') { es.close(); sending.value = false; return; }
        let e;
        try { e = JSON.parse(event.data); } catch { return; }
        if (!e || typeof e !== 'object' || Array.isArray(e)) return;
        if (e.type === 'RouteDecided') route = e.route;

        if (e.type === 'AnswerToken') {
          if (route !== 'chat') return;
          if (!streamItem || streamAttempt !== e.attempt) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
            streamAttempt = e.attempt;
          }
          streamItem.text += e.delta;
          scrollToBottom();
          return;
        }

        if (e.type === 'FinalAnswer') {
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
          }
          streamItem.text = e.reply;   // 토큰 합산 결과와 서버의 최종 텍스트를 일치시킨다
          streamItem.view = answerView(e);
          stepsItem.complete = true;
          streamItem = null;
          streamAttempt = null;
          scrollToBottom();
          return;
        }

        const fn = STEP_LABELS[e.type];
        if (!fn) return;
        const label = fn(e);
        if (!label) return;
        stepsItem.steps.push(label);
        scrollToBottom();
      };

      es.onerror = () => { es.close(); sending.value = false; };
    }

    return { backendLabel, log, input, sending, logEl, onSubmit, showEvidence,
      metricLabel, displayValue, rawText, issueLabel, sourceIndex, sourceDomId, sourceLabel, claimSections };
  },
}).mount('#app');
</script>
</body>
</html>
